# .pre-commit-config.yaml  ← リポジトリのルートに1枚配置
repos:
  - repo: local
    hooks:
      # ①② 最小チェック（フェンス未閉じ / 自作トークン混入）
      - id: md-minimal-check
        name: md-minimal-check
        language: python
        entry: python tools/md_minimal_check.py
        pass_filenames: false     # リポ全体を自前で走査
        stages: [commit]

      # ③ 復元=原文一致（壊さないことの保証）
      - id: md-strict-restore
        name: md-strict-restore
        language: system
        entry: python
        args: ["tools/run_strict_restore.py"]
        pass_filenames: false
        stages: [commit]
