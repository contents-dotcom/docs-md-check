# .pre-commit-config.yaml  ← リポジトリのルートに配置
repos:
  - repo: local
    hooks:
      # ①② 最小チェック（フェンス未閉じ / 自作トークン混入）
      - id: md-minimal-check
        name: md-minimal-check
        language: python
        entry: python tools/md_minimal_check.py
        pass_filenames: false   # リポ全体を自前で走査

      # ③ 復元=原文一致（書き出しなし・検査のみ）
      - id: md-strict-restore
        name: md-strict-restore
        language: system
        entry: python
        args: ["tools/strict_restore_check.py", ".", "--verbose"]
        pass_filenames: false
